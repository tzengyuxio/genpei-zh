# DOSBox-X config for the Traditional Chinese 源平合戦.
# Edit the "mount c" line to the folder that contains GENPEIZH, then start:
#   dosbox-x -conf genpei-zh.conf
[sdl]
autolock = false

[dosbox]
machine = svga_s3

[dosv]
dosv = jp
getsysfont = true

[dos]
country = 81
xms = false
ems = emsboard

[cpu]
cputype = 386
cycles = 20000

[autoexec]
mount c "C:\Games"
c:
cd GENPEIZH
Genpei.com
