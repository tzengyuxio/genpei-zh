# DOSBox-X profile for 源平合戦 (KOEI, 1994, IBM-PC DOS/V).
#
# The game is a DOS/V title: it draws kanji through the DOS/V display driver,
# so DOSBox-X must run in Japanese DOS/V mode (dosv=jp) on a VGA-class card.
# With dosv=jp enabled we do NOT need the third-party DOSJP.COM/FONT.DAT
# font loader that ships with this copy of the game.
#
# Launch through tools/dosbox/run.sh, which appends the [autoexec] lines.
# The script mounts ./build (never ./game) so the original copy stays clean.

[sdl]
autolock = false

[dosbox]
machine = svga_s3
captures = build/captures

[dosv]
# dosv lives in its own section; writing it under [dos] is silently ignored
# and the game draws its windows with no text in them.
dosv = jp
getsysfont = true

[dos]
country = 81
# The game needs EMS ("空きメモリが足りません" without it), but with XMS also
# present Main.exe faults forever in a rep movs right after the leader is
# chosen (DOSBox-X spins and even -time-limit stops firing). EMS only works.
xms = false
ems = emsboard

[cpu]
cputype = 386
cycles = 20000

[autoexec]
